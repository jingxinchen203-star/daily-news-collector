name: 每日病毒疫情日报

on:
  schedule:
    # GitHub Actions 使用 UTC；北京时间 08:30 对应 UTC 00:30
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-news-report
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 运行报告脚本
        run: python collect_and_send.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL || 'https://api.openai.com/v1/chat/completions' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL || 'claude-3-5-haiku-latest' }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://api.anthropic.com/v1/messages' }}
          AI_FALLBACK_PROVIDERS: ${{ vars.AI_FALLBACK_PROVIDERS || 'deepseek,openai,anthropic' }}
          NEWS_RSS_URLS: ${{ vars.NEWS_RSS_URLS }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          QQ_EMAIL_PASSWORD: ${{ secrets.QQ_EMAIL_PASSWORD }}
          NEWS_SENDER: ${{ secrets.NEWS_SENDER || '3502739363@qq.com' }}
          NEWS_RECEIVER: ${{ secrets.NEWS_RECEIVER || '3502739363@qq.com' }}
