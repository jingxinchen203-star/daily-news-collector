name: 紧急疫情预警

on:
  schedule:
    # GitHub Actions 使用 UTC，每 30 分钟执行一次
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: urgent-news-alert
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 安装依赖
        run: python -m pip install -r requirements.txt
      - name: 执行紧急检查
        run: python alert_check.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          QQ_EMAIL_PASSWORD: ${{ secrets.QQ_EMAIL_PASSWORD }}
          NEWS_SENDER: ${{ secrets.NEWS_SENDER || '3502739363@qq.com' }}
          NEWS_RECEIVER: ${{ secrets.NEWS_RECEIVER || '3502739363@qq.com' }}
